name: Release

# On a v* tag (or manual dispatch): build the THREE distribution-channel DMGs via the package_*.sh
# scripts and attach them to a GitHub Release / upload them as artifacts. Self-hosted macOS runner.
#   -mas     Apple-Store-compatible: private APIs OFF, nm-verified MAS-clean
#   -dev     development: Debug, arm64, private APIs ON
#   -public  public DMG (non-App-Store / direct download): universal, private APIs compiled but OFF by default
#
# Signing is automatic based on secrets: with none set the build is ad-hoc (users right-click →
# Open). Set these repo secrets to produce a Developer ID-signed + notarized build instead:
#   MACOS_CERT_P12        base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD   its export password
#   KEYCHAIN_PASSWORD     any throwaway password for the temp keychain
#   DEVELOPER_ID_IDENTITY e.g. "Developer ID Application: Tomer Zaidenstein (TEAMID)"
#   AC_API_KEY_ID / AC_API_ISSUER_ID / AC_API_KEY_P8 (base64 .p8)  — App Store Connect API key

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0); defaults to the tag"
        required: false

jobs:
  release:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${REF#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make verify

      # Developer ID signing is enabled only when the signing secrets exist; otherwise the build
      # stays ad-hoc (the `signed` output drives the later notarize/release-notes branches).
      - name: Detect signing secrets
        id: sign
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import Developer ID certificate
        if: steps.sign.outputs.signed == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}            # base64 of the .p12
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build the three channel DMGs
        env:
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # Developer ID-sign when secrets exist; otherwise FORCE ad-hoc ("-"). The explicit "-" matters
          # on this SELF-HOSTED runner: the package scripts default to the local "ZoneTilerWM Dev"
          # identity, which lives in this Mac's keychain but is invalid on anyone else's — exactly the
          # cert that made a hand-off build unopenable. Ad-hoc is the correct unsigned default.
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then SIGN_ID="$DEVELOPER_ID_IDENTITY"; else SIGN_ID="-"; fi
          # Tests already ran in the Test step → ZT_SKIP_TESTS=1 so the three builds don't repeat them.
          export ZT_VERSION="${{ steps.ver.outputs.version }}" ZT_DMG=1 ZT_SKIP_TESTS=1 ZT_SIGN_ID="$SIGN_ID"
          ./package_mas.sh       # Apple-Store-compatible: private APIs OFF, MAS-clean (nm-verified)
          ./package_public.sh    # public DMG: universal, private APIs compiled but OFF by default
          ./package_dev.sh       # development: Debug, arm64, private APIs ON
          mkdir -p dist
          cp /tmp/ZoneTilerWM/mas/dist/*.dmg \
             /tmp/ZoneTilerWM/public/dist/*.dmg \
             /tmp/ZoneTilerWM/dev/dist/*.dmg dist/
          ls -lh dist

      - name: Notarize + staple the DMGs
        if: steps.sign.outputs.signed == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}             # base64 of the App Store Connect .p8
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          for dmg in dist/*.dmg; do
            echo "==> notarize $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Upload DMG artifacts          # available on every run, incl. manual dispatch (no tag)
        uses: actions/upload-artifact@v4
        with:
          name: ZoneTilerWM-dmgs-${{ steps.ver.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release         # tag pushes only
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            NOTES="Developer ID signed + notarized. Three DMGs: -public (direct download / non-App-Store), -mas (App-Store-clean build), -dev (debug). Move ZoneTilerWM.app to /Applications; on first launch grant Accessibility in System Settings → Privacy & Security → Accessibility."
          else
            NOTES="Ad-hoc (unsigned) builds. Three DMGs: -public (direct download / non-App-Store), -mas (App-Store-clean), -dev (debug). First launch needs a one-time Gatekeeper unblock: right-click the app → Open, or 'xattr -dr com.apple.quarantine /Applications/ZoneTilerWM.app'. Then grant Accessibility in System Settings → Privacy & Security → Accessibility."
          fi
          gh release create "${{ github.ref_name }}" dist/*.dmg \
            --title "ZoneTilerWM ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --notes "$NOTES"
