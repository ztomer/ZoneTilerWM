# =============================================================================
# ZoneTilerWM configuration
# =============================================================================
# Edits are applied live (the agent watches this file). The Settings window
# (menubar -> Settings) edits the same keys and preserves these comments.
#
# Contents:
#   1. Modifier aliases
#   2. App launchers          (appCuts, hyperAppCuts, app_switcher)
#   3. System hotkeys
#   4. Tiling                 (modifiers, auto-tiler, hotkeys, margins, weights, working set)
#   5. Screens, grids & layouts
#   6. Pomodoro
#   7. Audio switcher
#   8. Window border
#   9. Window memory
#  10. Legacy / not used by the native app
# =============================================================================
version = "1.0.0"


# =============================================================================
# 1. Modifier aliases
# Named modifier combos referenced by the keybindings below.
# =============================================================================
[aliases]
mash = ["ctrl", "cmd"]
mash_app = ["shift", "ctrl"]
mash_shift = ["shift", "ctrl", "cmd"]
HYPER = ["shift", "ctrl", "alt", "cmd"]


# =============================================================================
# 2. App launchers
# Press the modifier + key to launch / focus the mapped app.
# =============================================================================

# Direct lowercase mapping (modifier = mash_app). Example apps are open source.
[appCuts]
modifier = ["mash_app"]
"q" = "OrcaSlicer"
"w" = "Signal"
"e" = "Finder"
"r" = "LibreOffice"
"t" = "Ghostty"
"a" = "Logseq"
"s" = "Thunderbird"
"d" = "Joplin"
"f" = "Zen"
"g" = "GIMP"
"z" = "Blender"
"x" = "Inkscape"
"c" = "Firefox"
"v" = "Zed"
"b" = "Audacity"

# Less-frequent apps / tools (modifier = HYPER). Example apps are open source.
[hyperAppCuts]
modifier = ["HYPER"]
"q" = "GnuCash"
"w" = "Weather"
"e" = "Clock"
"r" = "Element"
"t" = "Jan"
"a" = "Zettlr"
"s" = "KeePassXC"
"d" = ""
"f" = ""
"g" = ""
"z" = "OpenCode"
"x" = ""
"c" = "Chromium"
"v" = "VSCodium"
"b" = "Feishin"
"F1" = "Standard Notes"
"F2" = "Krita"

# App-switching behavior tweaks.
[app_switcher]
# Apps that need menu-based hiding (example).
hide_workaround_apps = ["Firefox"]
# Ambiguous app pairs that should not be considered matching (example).
ambiguous_apps = [
    ["zen", "zen browser"]
]

[app_switcher.special_app_mappings]
# Apps needing an exact "launch name" = "display name" mapping (example).
vscodium = "VSCodium"


# =============================================================================
# 3. System hotkeys
# Window hints, reload, activity monitor.
# =============================================================================
[system_hotkeys]
window_hints = ["HYPER", "-"]
activity_monitor = ["HYPER", "="]
reload = ["mash_shift", "R"]
# command_palette = ["HYPER", "space"]   # uncomment + set [command_palette] enabled to use it


# =============================================================================
# 4. Tiling
# =============================================================================
[tiler]
modifier = "mash"               # modifier for tile-to-zone (mash + zone key)
focus_modifier = "mash_shift"   # modifier for focus-cycle within a zone

# Auto-tiler sort order: "usage" (muscle memory; z-order tie-break) or
# "session" (recent use first; frequency tie-break).
auto_tiling_mode = "usage"

# Zones EXCLUDED from geometric deduction (keeps the "0" catch-all from
# hijacking the primary focus).
auto_tile_deduction_excludes = ["0"]

# Priority zones for the focused window during auto-tile (first available wins).
auto_tile_center_zones = ["j", "center", "0"]

# Placement strategy: 'rotate', 'largest_free_space', or 'hybrid'.
placement_strategy = "largest_free_space"

# Focus cycling.
overlap_threshold = 0.5         # min overlap to consider a window "in" a zone (50%)
flash_on_focus = true           # visual flash when cycling focus
focus_cycle_all_tiles = false   # cycle all tiles in a zone, not just the current one

settle_delay_sec = 0            # delay before learning a position (0 = off)
reposition_on_screen_change = true # Reposition windows when screen configuration changes
center_modals = true

[tiler.hotkeys]
placement_mode = ["mash", "p"]      # move window to next monitor
zone_info = ["mash", ";"]           # move window to previous monitor
focus_next_screen = ["mash_shift", "p"]
focus_prev_screen = ["mash_shift", ";"]
# stack_next = ["mash", "'"]        # cycle focus through windows stacked in the focused zone
# stack_prev = ["mash_shift", "'"]  # (opt-in: uncomment to bind; also via palette/CLI/MCP)
zen_mode = ["HYPER", "\\"]
resize_mode = ["mash", "r"]   # not HYPER+r — that's the "r" app launcher
auto_tile_screen = ["HYPER", "return"]
auto_tile_global = ["HYPER", ""]

[tiler.margins]
enabled = true
size = 5
screen_edge = true

# Auto-tiler cost weights. Higher magnitude = stronger; negative = reward.
[tiler.solver_weights]
memory_exact = -2000  # exact memory match (ID + monitor + zone + tile)
memory_zone  = -500   # correct zone, wrong tile
coverage     = -2000  # reward for maximizing screen real estate (scales with recency)
aspect_ratio = 300    # penalty for aspect-ratio mismatch
area_ratio   = 200    # penalty for area-size mismatch
moved_dist   = 1      # cost per pixel moved
skip_window  = 5000   # cost to leave a window unassigned

[tiler.working_set]
time_limit_sec = 1800   # seconds before an unfocused window is "stale" -> limbo (30 min)
max_capacity = 6        # max background windows tiled at once


# =============================================================================
# 5. Screens, grids & layouts
# =============================================================================

# -- Screen detection: map monitor names / sizes / orientation to a grid --
[tiler.screen_detection.patterns]
"DELL.*U32" = "4x3"      # Dell 32-inch
"DELL U3223QE" = "4x3"   # exact match
"LG.*QHD" = "1x3"        # LG QHD in portrait
"Built[-]?in" = "2x2"    # MacBook built-in
"Color LCD" = "2x2"
"internal" = "2x2"
"MacBook" = "2x2"

[tiler.screen_detection.sizes.large]
min = 27
layout = "4x3"           # 27" and larger
[tiler.screen_detection.sizes.medium]
min = 24
max = 26.9
layout = "3x3"           # 24-26"
[tiler.screen_detection.sizes.standard]
min = 20
max = 23.9
layout = "3x2"           # 20-23"
[tiler.screen_detection.sizes.small]
max = 19.9
layout = "2x2"           # under 20"

[tiler.screen_detection.portrait.large]
min = 23
layout = "1x3"           # 23"+ portrait
[tiler.screen_detection.portrait.small]
max = 22.9
layout = "1x2"           # under 23" portrait

# -- Grid dimensions (cols x rows) --
[tiler.grids."4x3"]
cols = 4
rows = 3
[tiler.grids."3x3"]
cols = 3
rows = 3
[tiler.grids."3x2"]
cols = 3
rows = 2
[tiler.grids."2x2"]
cols = 2
rows = 2
[tiler.grids."1x3"]
cols = 1
rows = 3
[tiler.grids."1x2"]
cols = 1
rows = 2

# -- Per-monitor grid/layout override by exact screen name --
[tiler.custom_screens."DELL U3223QE"]
layout = "4x3"
[tiler.custom_screens."DELL U3223QE".grid]
cols = 4
rows = 3

[tiler.custom_screens."LG IPS QHD"]
layout = "1x3"
[tiler.custom_screens."LG IPS QHD".grid]
cols = 1
rows = 3

# -- Zone -> tile-cycle definitions per layout (e.g. "a1:b2"). Each zone key
#    cycles through its tile list on repeated presses. --

# 4x3 (large displays)
[tiler.layouts."4x3"]
"y" = ["a1:a2", "a1", "a1:b2"]
"h" = ["a1:b3", "a1:a3", "a1:c3", "a2"]
"n" = ["a3", "a2:a3", "a3:b3"]
"u" = ["b1:b3", "b1:b2", "b1", "b1:c1"]
"j" = ["b1:c3", "b1:b3", "b2", "b1:d3"]
"m" = ["b1:b3", "b2:c3", "b3"]
"i" = ["d1:d3", "d1:d2", "d1"]
"k" = ["c1:d3", "c1:c3", "c2"]
"," = ["d1:d3", "d2:d3", "d3"]
"o" = ["c1:d1", "d1", "c1:d2"]
"l" = ["d1:d3", "c1:d3", "b1:d3", "d2"]
"." = ["d3", "d2:d3", "c3:d3"]
"0" = ["b2:c2", "a1:d3", "center"]

# 2x2 (small displays / laptops)
[tiler.layouts."2x2"]
"y" = ["a1", "a1:a2", "a1:b1"] # top-left
"h" = ["a1:a2"] # Left tile
"n" = ["a2", "a2:b2"]          # bottom-left
"u" = ["a1:b1", "b1"]          # top
"j" = ["a1:b2"]                # center (full screen)
"m" = ["a2:b2", "b2"]          # bottom
"i" = ["b1", "a1:b1"]          # top-right
"k" = ["b1:b2", "b2"]          # right
"," = ["b2", "a2:b2"]          # bottom-right
"0" = ["center", "a1:b2", "a1:b1"]

# 3x2
[tiler.layouts."3x2"]
"y" = ["a1", "a1:a2"]
"h" = ["a1:a2", "a1:b2"]
"n" = ["a2", "a1:a2"]
"u" = ["b1", "b1:b2"]
"j" = ["b1:b2", "a1:c2"]
"m" = ["b2", "b1:b2"]
"i" = ["c1", "c1:c2"]
"k" = ["c1:c2", "b1:c2"]
"," = ["c2", "c1:c2"]
"0" = ["center", "b1:b2", "a1:c2"]

# 3x3
[tiler.layouts."3x3"]
"y" = ["a1", "a1:a2", "a1:b1"]
"h" = ["a1:a3", "a1:a2", "a2"]
"n" = ["a3", "a2:a3", "a3:b3"]
"u" = ["b1", "b1:b2", "a1:b1"]
"j" = ["b2", "b1:b3", "a1:c3"]
"m" = ["b3", "b2:b3", "a3:c3"]
"i" = ["c1", "c1:c2", "b1:c1"]
"k" = ["c1:c3", "c2:c3", "c2"]
"," = ["c3", "c2:c3", "b3:c3"]
"0" = ["b2", "center", "a1:c3"]

# Portrait
[tiler.layouts."1x3"]
"y" = ["a1", "a1:a2"]
"h" = ["a2", "a1:a3"]
"n" = ["a3", "a2:a3"]
"0" = ["a1:a3", "a2", "center"]

[tiler.layouts."1x2"]
"y" = ["a1", "a1:a2"]
"h" = ["a2", "a1:a2"]
"0" = ["a1:a2", "center"]

# Default fallback (named regions)
[tiler.layouts.default]
"y" = ["top-half"]
"h" = ["left-half"]
"n" = ["bottom-half"]
"u" = ["top-half"]
"j" = ["full"]
"m" = ["bottom-half"]
"i" = ["top-half"]
"k" = ["right-half"]
"," = ["bottom-half"]
"0" = ["center", "full"]


# =============================================================================
# 6. Pomodoro
# =============================================================================
[pomodoro]
enable_color_bar = true
work_period_sec = 3120          # 52 min
rest_period_sec = 1020          # 17 min
indicator_height = 0.2          # ratio of the menubar height (0..1)
indicator_alpha = 0.3
indicator_in_all_spaces = true
color_time_remaining = "green"
color_time_used = "red"

[pomodoro.hotkeys]
enable = ["mash", "8"]
disable = ["mash", "9"]
reset = ["mash_shift", "8"]   # not mash_shift+0 — that's "focus zone 0"


# =============================================================================
# 7. Audio switcher
# Cycle the default output device with the hotkey.
# =============================================================================
[audio_switcher]
devices = ["Audioengine 2+", "Bose QC35 II", "WH-1000XM6"]
hotkey = ["HYPER", "'"]
# macOS Shortcut to run when the default device changes ("" disables).
shortcut_callback = "SoundSourceSwitcherEx"


# =============================================================================
# 8. Window border
# A colored outline around the focused window that follows it as it moves.
# =============================================================================
[borders]
enabled = false              # off by default — opt-in
color = "blue"               # green/red/blue/yellow/orange/purple/white/black/gray
width = 4                    # stroke width, px
corner_radius = 9            # px
backend = "overlay"          # "overlay" (default, public API) | "skylight" (experimental, private — last resort)
prediction = true            # lead the outline to compensate for follow-lag


# =============================================================================
# 8b. Automation (MCP server + zonetiler-cli)
# Lets your Claude (Desktop/Code) and the zonetiler-cli control the window manager
# over a local Unix socket. Enabled by default; uncomment to opt out. See docs/AUTOMATION.md.
# =============================================================================
# [automation]
# enabled = true             # set false to disable the MCP/CLI control socket entirely
#
# [command_palette]          # in-app ⌘K fuzzy command launcher (opt-in; also set the
# enabled = true             # command_palette hotkey under [system_hotkeys] above)
#
# [zone_hud]                 # modifier-held zone cheat-sheet overlay (opt-in)
# enabled = true
# hold_delay_ms = 400          # hold the tiling modifier this long before the HUD appears
#
# [drag_snap]                # drag a window with the tiling modifier held → snaps to the zone
# enabled = true             # under the cursor on drop (opt-in; observes mouse drags passively)
#
# [sync]                     # file-based settings sync across machines (no network/entitlements)
# folder = "~/Library/Mobile Documents/com~apple~CloudDocs"   # a folder you already sync (iCloud/
#                            # Dropbox/…). Then: `zonetiler-cli sync-export` / `sync-import`.
#
# [break_screen]             # retro full-screen overlay when a Pomodoro work period ends (opt-in)
# enabled = true
# duration_sec = 6           # how long the "BREAK TIME" overlay stays up (click to dismiss sooner)
#
# [scratchpad]               # summon/dismiss a set of utility apps together (opt-in)
# apps = ["Terminal"]        # bind a `scratchpad` hotkey under [system_hotkeys], or use the
# auto_dismiss = true        # `scratchpad` action; auto_dismiss hides the set when focus leaves it
#
# [[clusters]]               # named app→zone profiles; apply with `cluster name=dev` (opt-in)
# name = "dev"               # launches missing apps + tiles each app's window to its zone
#   [[clusters.windows]]
#   app = "Ghostty"
#   zone = "h"
#   [[clusters.windows]]
#   app = "Zen"
#   zone = "l"


# =============================================================================
# 8c. Window rules — declarative match → action (see docs/AUTOMATION.md)
# Match by app name; fire on a trigger; run an action (same names/params as the CLI/MCP).
# trigger: on-open (wired) | on-focus | on-display-change
# Example (uncomment to use): auto-place Arc + Slack when they open.
# =============================================================================
# [[rules]]
# app = "Arc"
# trigger = "on-open"
# action = "tile"
# zone = "k"
#
# [[rules]]
# app = "Slack"
# trigger = "on-open"
# action = "tile"
# zone = "l"


# =============================================================================
# 9. Window memory
# Learns and restores window positions across sessions.
# =============================================================================
[window_memory]
enabled = true
max_preference_entries = 1000   # max unique entries to remember
settle_delay_sec = 2.0          # wait before learning a position
save_interval_sec = 60          # periodic save (0 = off)
cache_dir = "~/.config/ZoneTilerWM"
excluded_apps = ["System Settings", "System Preferences", "Activity Monitor", "Calculator", "Photo Booth", "KeyCastr", "Installer"]
auto_tile_fallback = true
default_zone = "0"

[window_memory.hotkeys]
capture = ["HYPER", "9"]
restore = ["HYPER", "0"]

# Default zone for specific apps when no position is remembered yet.
[window_memory.app_zones]
"Firefox" = "k"
"Ghostty" = "h"
"VSCodium" = "h"
"Logseq" = "j"
"Feishin" = "i"


# =============================================================================
# 10. Legacy / not used by the native app
# Kept for reference and Hammerspoon compatibility; the native ZoneTilerWM
# agent does not read these sections.
# =============================================================================
[tiler.advanced]
use_applescript_window_movement = false   # AppleScript moves instead of AX (SentinelOne escape hatch)
use_window_cache = true                   # cache window data to avoid allWindows() queries
enterprise_mode = false                   # AXEnhancedUI workaround for hooked machines
debug_logging = false

[tiler.delays]
screen_change_reposition_sec = 0.1
new_window_initial_sec = 0.05
new_window_placement_sec = 0.1
smart_placement_reposition_sec = 0.1
flash_on_focus_duration_sec = 0.2

[tiler.cache_size]
positions = 500
window_info = 200

[window_handling]
modal_dialog_behavior = "ignore"   # "center", "tile", or "ignore"

[layout_manager]
enabled = true
